name: Hosted math verification

on:
  push:
    branches:
      - 'merlin/hidden-source-pairing-hosted-check'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the capture tools and the exact source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install the pinned Node packages
        timeout-minutes: 2
        run: npm install --prefer-offline --no-audit --no-fund --fetch-retries=1 --fetch-timeout=20000 --prefix "$RUNNER_TEMP/math-runtime" playwright@1.56.1 mathjax-full@3.2.1
      - name: Install only the headless browser using runner image libraries
        timeout-minutes: 3
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 20000
        run: node "$RUNNER_TEMP/math-runtime/node_modules/playwright/cli.js" install chromium --only-shell
      - name: Capture the integrated public scientific revision
        run: |
          export NODE_PATH="$RUNNER_TEMP/math-runtime/node_modules"
          node .github/hosted-review/capture_hosted_math.cjs --root "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" --revision ac2217885e61e3428c7db5d0ad56493261374299 --output "$RUNNER_TEMP/hosted-math"
      - name: Retain the capture and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-math-ac2217885e61e3428c7db5d0ad56493261374299
          path: ${{ runner.temp }}/hosted-math
          if-no-files-found: error
          retention-days: 14
